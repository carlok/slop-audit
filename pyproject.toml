[project]
name = "slop-audit"
version = "0.1.0"
description = "Local multi-tool harness to score prose for AI-slop, writing issues, stats, and separate AI-authorship detector signals."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Carlo Perassi" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/carlok/slop-audit"
Repository = "https://github.com/carlok/slop-audit"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
