# Basic regression checks: pytest suite + install script syntax only.
# Does not run scripts/install_all.sh or provision tool/ML environments.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8.0'

      - name: Bash syntax (install script)
        run: bash -n scripts/install_all.sh

      - name: Run tests
        run: PYTHONPATH=. pytest -q
